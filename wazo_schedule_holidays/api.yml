paths:
  /schedule-holidays/countries:
    get:
      operationId: list_schedule_holidays_countries
      summary: List the countries (and subdivisions) with a public holiday calendar
      description: |
        **Required ACL:** `confd.schedule_holidays.read`

        Country names are the English ISO 3166 names. Subdivision names are the
        longest alias known by the calendar library, or the code itself.
      tags:
      - schedules
      responses:
        '200':
          description: Countries
          schema:
            $ref: '#/definitions/ScheduleHolidaysCountries'
  /schedule-holidays/countries/{country_code}:
    get:
      operationId: list_schedule_holidays_country_holidays
      summary: List the public holidays of a country for a year
      description: |
        **Required ACL:** `confd.schedule_holidays.read`

        The `key` of a holiday is its English name: it does not depend on
        `language` and is what `excluded` refers to.
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/scheduleholidayscountrycode'
      - name: subdivision
        in: query
        type: string
        required: false
        description: Subdivision code (see the countries list)
      - name: year
        in: query
        type: integer
        required: false
        description: Year, defaults to the current year
      - name: language
        in: query
        type: string
        required: false
        default: en_US
        description: |
          Language of the holiday names. If the country does not support it, English
          (`en_US`) is used, then the language of the country.
      responses:
        '200':
          description: Holidays
          schema:
            $ref: '#/definitions/ScheduleHolidaysCountryHolidays'
        '400':
          $ref: '#/responses/CreateError'
        '404':
          $ref: '#/responses/NotFoundError'
  /schedules/{schedule_id}/holidays:
    get:
      operationId: get_schedule_holidays
      summary: Get the public holidays configuration of a schedule
      description: '**Required ACL:** `confd.schedules.{schedule_id}.holidays.read`'
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/scheduleid'
      responses:
        '200':
          description: Configuration
          schema:
            $ref: '#/definitions/ScheduleHolidays'
        '404':
          $ref: '#/responses/NotFoundError'
    put:
      operationId: update_schedule_holidays
      summary: Create or replace the public holidays configuration of a schedule
      description: |
        **Required ACL:** `confd.schedules.{schedule_id}.holidays.update`

        Only the configuration is stored: call the `sync` route (or wait for the
        daily synchronisation) to apply it. The closures are not affected.
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/scheduleid'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/ScheduleHolidays'
      responses:
        '204':
          $ref: '#/responses/ResourceUpdated'
        '400':
          $ref: '#/responses/UpdateError'
        '404':
          $ref: '#/responses/NotFoundError'
        '409':
          description: The schedule is being updated by another request
    delete:
      operationId: delete_schedule_holidays
      summary: Remove the holidays configuration and the periods it created
      description: |
        **Required ACL:** `confd.schedules.{schedule_id}.holidays.delete`

        Exceptional periods that were not created by the plugin, and the
        one-off closures, are kept.
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/scheduleid'
      responses:
        '204':
          $ref: '#/responses/ResourceDeleted'
        '404':
          $ref: '#/responses/NotFoundError'
        '409':
          description: The schedule is being updated by another request
  /schedules/{schedule_id}/exceptional-periods/sync:
    post:
      operationId: sync_schedule_exceptional_periods
      summary: Apply the holidays and the closures to the schedule
      description: |
        **Required ACL:** `confd.schedules.{schedule_id}.exceptional_periods.sync.create`

        Creates one full-day exceptional period per holiday (and one period per
        day of each one-off closure) in the next 365 days, using the closed destination of the schedule, and removes the
        periods created previously that are no longer wanted. wazo-agid ignores
        the year of a period: the synchronisation must therefore run every day.
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/scheduleid'
      - name: dry_run
        in: query
        type: boolean
        required: false
        default: false
        description: Compute the changes without applying them
      responses:
        '200':
          description: Result of the synchronisation
          schema:
            $ref: '#/definitions/ScheduleHolidaysSync'
        '404':
          $ref: '#/responses/NotFoundError'
        '409':
          description: The schedule is being updated by another request
  /schedules/{schedule_id}/holidays/sync:
    post:
      operationId: sync_schedule_holidays
      summary: Alias of `exceptional-periods/sync`
      description: |
        **Required ACL:** `confd.schedules.{schedule_id}.holidays.sync.create`

        Former route, kept as an alias (it applies the holidays *and* the closures).

        Creates one full-day exceptional period per holiday (and one period per
        day of each one-off closure) in the next 365 days, using the closed destination of the schedule, and removes the
        periods created previously that are no longer wanted. wazo-agid ignores
        the year of a period: the synchronisation must therefore run every day.
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/scheduleid'
      - name: dry_run
        in: query
        type: boolean
        required: false
        default: false
        description: Compute the changes without applying them
      responses:
        '200':
          description: Result of the synchronisation
          schema:
            $ref: '#/definitions/ScheduleHolidaysSync'
        '404':
          $ref: '#/responses/NotFoundError'
        '409':
          description: The schedule is being updated by another request
  /schedules/{schedule_id}/closures:
    get:
      operationId: list_schedule_closures
      summary: List the one-off closures of a schedule
      description: '**Required ACL:** `confd.schedules.{schedule_id}.closures.read`'
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/scheduleid'
      responses:
        '200':
          description: Closures
          schema:
            $ref: '#/definitions/ScheduleClosureList'
        '404':
          $ref: '#/responses/NotFoundError'
    post:
      operationId: create_schedule_closure
      summary: Create a one-off closure and apply it to the schedule
      description: |
        **Required ACL:** `confd.schedules.{schedule_id}.closures.create`

        A closure does not need a holidays configuration. As an exceptional
        period has no year and a single set of hours, a closure becomes one
        period per day (e.g. 12:00-23:59, then 00:00-14:00): the periods are
        created once the date is within the next 365 days and removed once it is
        past. The schedule is synchronised immediately. At most 100 closures,
        each spanning at most 366 days.
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/scheduleid'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/ScheduleClosure'
      responses:
        '201':
          description: The created closure
          schema:
            $ref: '#/definitions/ScheduleClosure'
        '400':
          $ref: '#/responses/CreateError'
        '404':
          $ref: '#/responses/NotFoundError'
        '409':
          description: The schedule is being updated by another request
  /schedules/{schedule_id}/closures/{closure_id}:
    get:
      operationId: get_schedule_closure
      summary: Get a one-off closure
      description: '**Required ACL:** `confd.schedules.{schedule_id}.closures.{closure_id}.read`'
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/scheduleid'
      - $ref: '#/parameters/scheduleclosureid'
      responses:
        '200':
          description: Closure
          schema:
            $ref: '#/definitions/ScheduleClosure'
        '404':
          $ref: '#/responses/NotFoundError'
    put:
      operationId: update_schedule_closure
      summary: Replace a one-off closure and apply it to the schedule
      description: '**Required ACL:** `confd.schedules.{schedule_id}.closures.{closure_id}.update`'
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/scheduleid'
      - $ref: '#/parameters/scheduleclosureid'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/ScheduleClosure'
      responses:
        '204':
          $ref: '#/responses/ResourceUpdated'
        '400':
          $ref: '#/responses/UpdateError'
        '404':
          $ref: '#/responses/NotFoundError'
        '409':
          description: The schedule is being updated by another request
    delete:
      operationId: delete_schedule_closure
      summary: Delete a one-off closure and its periods
      description: '**Required ACL:** `confd.schedules.{schedule_id}.closures.{closure_id}.delete`'
      tags:
      - schedules
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/scheduleid'
      - $ref: '#/parameters/scheduleclosureid'
      responses:
        '204':
          $ref: '#/responses/ResourceDeleted'
        '404':
          $ref: '#/responses/NotFoundError'
        '409':
          description: The schedule is being updated by another request
parameters:
  scheduleclosureid:
    required: true
    type: string
    name: closure_id
    in: path
    description: Identifier of the closure
  scheduleholidayscountrycode:
    required: true
    type: string
    name: country_code
    in: path
    description: ISO 3166-1 alpha-2 country code, e.g. `NL` or `FR`
definitions:
  ScheduleHolidays:
    title: ScheduleHolidays
    properties:
      country:
        type: string
        description: Country code, e.g. `NL`
      subdivision:
        type: string
        description: Subdivision code, e.g. `6AE` (Alsace) or `57` (Moselle) for `FR`
      excluded:
        type: array
        description: Keys of the holidays that must not close the schedule
        items:
          type: string
      managed:
        type: array
        readOnly: true
        description: Periods created by the plugin (holidays, and closures when listed here)
        items:
          $ref: '#/definitions/ScheduleHolidaysEntry'
    required:
    - country
  ScheduleClosureList:
    properties:
      total:
        type: integer
      items:
        type: array
        items:
          $ref: '#/definitions/ScheduleClosure'
  ScheduleClosure:
    properties:
      id:
        type: string
        readOnly: true
      start:
        type: string
        example: '2027-11-19T12:00'
        description: |
          First minute of the closure, `YYYY-MM-DDTHH:MM`, in the timezone of the
          schedule (no UTC offset, no seconds)
      end:
        type: string
        example: '2027-11-20T14:00'
        description: |
          Last minute of the closure (inclusive, like the `23:59` of a full day),
          same format. Must be after `start`.
      label:
        type: string
        description: Optional name, reported as `key` in `managed` (default `closure`)
    required:
    - start
    - end
  ScheduleHolidaysEntry:
    properties:
      date:
        type: string
        format: date
      key:
        type: string
      hours_start:
        type: string
        description: '`00:00` for a holiday; may differ for a closure'
      hours_end:
        type: string
        description: '`23:59` for a holiday; may differ for a closure'
      closure_id:
        type: string
        description: Closure the period belongs to (absent for a holiday)
  ScheduleHolidaysSync:
    properties:
      dry_run:
        type: boolean
      changed:
        type: boolean
      today:
        type: string
        format: date
        description: Today's date in the schedule timezone
      added:
        type: array
        items:
          $ref: '#/definitions/ScheduleHolidaysEntry'
      removed:
        type: array
        items:
          properties:
            month:
              type: integer
            day:
              type: integer
            hours_start:
              type: string
            hours_end:
              type: string
      managed:
        type: array
        items:
          $ref: '#/definitions/ScheduleHolidaysEntry'
  ScheduleHolidaysCountries:
    properties:
      total:
        type: integer
      items:
        type: array
        items:
          properties:
            code:
              type: string
            name:
              type: string
            subdivisions:
              type: array
              items:
                properties:
                  code:
                    type: string
                  name:
                    type: string
  ScheduleHolidaysCountryHolidays:
    properties:
      total:
        type: integer
      items:
        type: array
        items:
          properties:
            key:
              type: string
            name:
              type: string
            date:
              type: string
              format: date
